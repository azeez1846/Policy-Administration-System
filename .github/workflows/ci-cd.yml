name: Guidewire PolicyCenter CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build & Execute Unit Tests
  # ---------------------------------------------------------------------------
  test-and-build:
    name: 🧪 Run Maven Unit Tests & Package JAR
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: ⚙️ Compile Backend & Execute 13 Feature Unit Tests
        run: mvn clean test -B

      - name: 📦 Build Production Executable JAR
        run: mvn clean package -DskipTests -B

      - name: 📤 Upload Build Artifact (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: policycenter-sandbox-jar
          path: target/policycenter-sandbox-1.0.0.jar
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: Build Docker Image & Publish to GitHub Container Registry (GHCR)
  # ---------------------------------------------------------------------------
  docker-build-and-push:
    name: 🐳 Build & Publish Docker Image to GHCR / Docker Hub
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🔧 Set up QEMU (Multi-Arch Support)
        uses: docker/setup-qemu-action@v3

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: 🚀 Build Docker Image & Push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
